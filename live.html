<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Live Chessboard</title>
  <!-- Chessboard.js library CSS (for board styling) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <style>
    /* Basic styling for games list */
    #gamesList .game-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    #gamesList .game-item:hover { background: #f0f0f0; }
    /* Modal overlay and content styling */
    #modal {
      display: none; position: fixed; z-index: 1000;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
    }
    .modal-content {
      background: #fff; padding: 20px;
      margin: 5% auto; width: 90%; max-width: 600px;
      border-radius: 4px; position: relative;
    }
    /* Close button (X) in the modal */
    #closeBtn {
      position: absolute; top: 10px; right: 10px;
      font-size: 24px; font-weight: bold; cursor: pointer;
    }
    /* Chessboard container size */
    #board { 
      width: 400px; /* adjust as needed for board size */
      margin: 20px auto;
    }
    /* Moves text area styling */
    #movesText {
      white-space: pre-wrap; /* allow wrapping of PGN text */
      max-height: 200px; overflow-y: auto;
      font-family: sans-serif; font-size: 14px;
      background: #f9f9f9; padding: 10px;
      border: 1px solid #ddd; border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Event title (set dynamically from PGN [Event] tag) -->
  <h2 id="eventName"></h2>

  <!-- Round selection dropdown -->
  <label for="roundSelect">Выбрать тур:</label>
  <select id="roundSelect"></select>

  <!-- Container for the list of games of the selected round -->
  <div id="gamesList"></div>

  <!-- Modal for game details -->
  <div id="modal">
    <div class="modal-content">
      <span id="closeBtn">&times;</span>
      <h3 id="gameTitle"></h3>
      <div id="board"></div>
      <p id="movesText"></p>
    </div>
  </div>

  <!-- Include required libraries: jQuery (for chessboard.js), then chess.js, then chessboard.js -->
  <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    // Parse PGN text into game objects array
    function parsePGN(pgnText) {
      const games = [];
      let currentGame = null;
      let readingMoves = false;
      const lines = pgnText.split(/\r?\n/);
      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed === "") {
          // Empty line indicates end of tag section or separation between games
          if (currentGame && !readingMoves) {
            // Finished tags, now moves will follow
            readingMoves = true;
            currentGame.Moves = ""; 
            continue;
          }
          // If already reading moves and see an empty line, it might be end of a game.
          continue;
        }
        if (trimmed.startsWith("[")) {
          // PGN Tag line (e.g., [Event "..."])
          if (currentGame && readingMoves) {
            // If we were reading moves and encounter a new tag, previous game ended
            currentGame.Moves = (currentGame.Moves || "").trim();
            games.push(currentGame);
            currentGame = null;
            readingMoves = false;
          }
          if (!currentGame) currentGame = {};
          // Parse the tag line inside [ ]
          let tagContent = trimmed.slice(1, -1);  // remove [ and ]
          const spaceIdx = tagContent.indexOf(" ");
          if (spaceIdx !== -1) {
            const tagName = tagContent.substring(0, spaceIdx);
            let tagValue = tagContent.substring(spaceIdx + 1).trim();
            if (tagValue.startsWith("\"") && tagValue.endsWith("\"")) {
              tagValue = tagValue.slice(1, -1);  // remove surrounding quotes
            }
            currentGame[tagName] = tagValue;
          }
        } else {
          // Moves line
          if (currentGame) {
            if (!readingMoves) {
              readingMoves = true;
              currentGame.Moves = "";
            }
            // Append moves (with a space separator)
            currentGame.Moves += (currentGame.Moves ? " " : "") + trimmed;
          }
        }
      }
      // Push the last game (if any) after parsing all lines
      if (currentGame) {
        currentGame.Moves = (currentGame.Moves || "").trim();
        games.push(currentGame);
      }
      return games;
    }

    // Global variables for games data and current selection
    let gamesAll = [];
    let currentRound = "";
    let openGameIndex = null;
    const chess = new Chess();  // chess.js instance for game logic
    let board = null;          // chessboard.js instance for the board

    // Display games of the specified round
    function showRound(round) {
      currentRound = round;
      const gamesListDiv = document.getElementById("gamesList");
      gamesListDiv.innerHTML = "";  // clear existing list
      let count = 0;
      // Loop through all games and list those matching the round
      gamesAll.forEach((game, idx) => {
        if (game.Round === round) {
          count++;
          const item = document.createElement("div");
          item.className = "game-item";
          item.textContent = count + ". " + game.White + " – " + game.Black + " (" + game.Result + ")";
          item.addEventListener("click", () => showGame(idx));
          gamesListDiv.appendChild(item);
        }
      });
    }

    // Show a specific game in the modal by its index in gamesAll
    function showGame(index) {
      const game = gamesAll[index];
      if (!game) return;
      openGameIndex = index;  // remember which game is open
      // Set modal title to "WhitePlayer – BlackPlayer (Result)"
      document.getElementById("gameTitle").innerText = `${game.White} – ${game.Black} (${game.Result})`;
      // Load the moves into the chess.js instance to get final position
      chess.reset();
      if (game.Moves) {
        chess.load_pgn(game.Moves);  // parse moves (PGN string) into chess.js&#8203;:contentReference[oaicite:2]{index=2}
      }
      // Initialize chessboard.js if not already done
      if (board === null) {
        board = Chessboard('board', {
          pieceTheme: 'img/chesspieces/wikipedia/{piece}.png',
          position: 'start'
        });
      }
      // Set the board to the final FEN position of the game
      board.position(chess.fen());
      // Display the moves text
      document.getElementById("movesText").innerText = game.Moves || "";
      // Show the modal
      document.getElementById("modal").style.display = "block";
    }

    // Close the modal and clear open game index
    function closeModal() {
      document.getElementById("modal").style.display = "none";
      openGameIndex = null;
    }

    // Fetch and update the games list (called on interval)
    function updateGames() {
      fetch("CCL_Petrovskij_Putevoj_Dvorec_Na_razryad__rejting_do_1550_FShR__2009_g_r__i_molozhe_.pgn")
        .then(response => response.text())
        .then(text => {
          const newGames = parsePGN(text);
          // If games list changed or on first load, update global list and UI
          gamesAll = newGames;
          if (gamesAll.length) {
            // Update Event title (assuming all games share the same Event)
            document.getElementById("eventName").innerText = gamesAll[0].Event || "";
          }
          // Build unique rounds list and sort numerically (or lexically if needed)
          const rounds = [...new Set(gamesAll.map(g => g.Round))];
          rounds.sort((a, b) => {
            // numeric sort if possible
            const na = parseInt(a), nb = parseInt(b);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            return a.localeCompare(b);
          });
          const roundSelect = document.getElementById("roundSelect");
          // Update dropdown options if rounds changed in number or content
          if (roundSelect.options.length !== rounds.length) {
            const prevValue = roundSelect.value;
            roundSelect.innerHTML = "";
            rounds.forEach(r => {
              const opt = document.createElement("option");
              opt.value = r;
              opt.textContent = "Тур " + r;
              roundSelect.appendChild(opt);
            });
            // Preserve previously selected round if still available, otherwise select first
            if (prevValue && rounds.includes(prevValue)) {
              roundSelect.value = prevValue;
              currentRound = prevValue;
            } else {
              currentRound = rounds[0] || "";
              roundSelect.value = currentRound;
            }
          }
          // Show games of the current round (update list)
          if (currentRound) {
            showRound(currentRound);
          }
          // If a game is open in the modal, update it (e.g., new moves added)
          if (openGameIndex !== null) {
            showGame(openGameIndex);
          }
        })
        .catch(err => console.error("Error fetching PGN:", err));
    }

    // Event: round selection changed
    document.getElementById("roundSelect").addEventListener("change", function() {
      showRound(this.value);
    });
    // Event: close modal on close button click or outside click
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    window.addEventListener("click", function(e) {
      if (e.target === document.getElementById("modal")) {
        closeModal();
      }
    });

    // Initial load and periodic refresh
    updateGames();               // load once
    setInterval(updateGames, 2000);  // auto-update every 2 seconds
  </script>

</body>
</html>
