<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Live Chess Multi-Tournament Viewer</title>
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous"/>
  <style>
    body { margin:0; padding:20px; font-family:sans-serif; background:#f4f5f7; }
    header { display:flex; gap:10px; margin-bottom:20px; }
    select { padding:6px; font-size:16px; }
    #boardsContainer { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
    .board-card { background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1);
                  cursor:pointer; overflow:hidden; }
    .board-card .info { padding:8px; font-size:14px; }
    #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
             background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
    #modal.show { display:flex; }
    #modalContent { background:#fff; border-radius:8px; padding:20px; max-width:90%; max-height:90%;
                    overflow:auto; text-align:center; position:relative; }
    #closeModal { position:absolute; top:8px; right:12px; font-size:24px; cursor:pointer; }
    #notation { margin-top:12px; white-space:nowrap; overflow-x:auto; scroll-snap-type:x mandatory;
                 -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #notation::-webkit-scrollbar { display:none; }
    #notation .move { display:inline-block; scroll-snap-align:center; padding:4px 8px;
                      margin-right:4px; border-radius:4px; background:#eee; cursor:pointer; }
    #notation .move.active { background:#4a90e2; color:#fff; }
    .controls { margin-top:10px; }
    .controls button { margin:0 5px; padding:6px 12px; }
  </style>
</head>
<body>
  <header>
    <select id="eventSelector"></select>
    <select id="roundSelector"></select>
  </header>
  <div id="boardsContainer">Загрузка...</div>

  <div id="modal">
    <div id="modalContent">
      <span id="closeModal">&times;</span>
      <div id="modalBoard"></div>
      <div class="controls">
        <button id="prevBtn">← Назад</button>
        <button id="nextBtn">Вперед →</button>
      </div>
      <div id="notation"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
  <script>
  (async function(){
    // PGN URLs
    const PGN_URLS = [
      "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament",
      "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7eJEJl1DyD2DNu7IxZBAlKBDIdkh314Cbjc6u_5jGnbAsw3Z?type=tournament",
      "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXaNY79hEJl1DyD2DNu7IxZBAlKBDIdkhz2xMbjc6u_5jGnbAsw3Z?type=tournament"
    ];
    const PROXY = "https://api.allorigins.win/raw?url=";
    const pieceTheme = "https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png";
    let tournaments = [], currentEvent = 0;

    // Fetch & parse PGN
    async function loadAll() {
      const texts = await Promise.all(PGN_URLS.map(u=>fetch(PROXY+encodeURIComponent(u),{cache:'no-store'}).then(r=>r.text())));
      tournaments = texts.map(parsePGN);
      renderEventSelector();
      renderRoundSelector();
    }

    // Parse raw PGN -> { event, gamesByRound: {round: [game,...]} }
    function parsePGN(pgn) {
      const chunks = pgn.trim().split(/\r?\n\r?\n(?=\[)/);
      let event="", gamesByRound={};
      for(let c of chunks){
        let [tags,moves] = c.split(/\r?\n\r?\n/);
        if(!moves) continue;
        let tagObj={};
        tags.match(/\[.*?\]/g).forEach(line=>{
          let m=line.match(/^\[(\w+)\s+"(.+)"\]/);
          if(m) tagObj[m[1]] = m[2];
        });
        if(!event && tagObj.Event) event = tagObj.Event;
        let round = tagObj.Round||"?";
        let san = moves.replace(/\{.*?\}/g,"").replace(/\d+\./g,"").replace(/1-0|0-1|1\/2-1\/2|\*/g,"").trim().split(/\s+/);
        let chess = new Chess();
        san.forEach(m=>chess.move(m));
        gamesByRound[round] = gamesByRound[round]||[];
        gamesByRound[round].push({tags:tagObj,moves:san,chess,board:null});
      }
      return {event,gamesByRound};
    }

    // Render selectors
    function renderEventSelector(){
      const sel = $("#eventSelector").empty();
      tournaments.forEach((t,i)=>sel.append(`<option value="${i}">${t.event}</option>`));
      sel.val(currentEvent).on("change",()=>{
        currentEvent = +sel.val();
        renderRoundSelector();
      });
    }
    function renderRoundSelector(){
      const rounds = Object.keys(tournaments[currentEvent].gamesByRound)
        .filter(r=>r!=="?").sort((a,b)=>a-b);
      const sel = $("#roundSelector").empty();
      rounds.forEach(r=>sel.append(`<option value="${r}">Тур ${r}</option>`));
      sel.val(rounds.pop()||"?").on("change",()=>renderBoards(sel.val()));
      renderBoards(sel.val());
    }

    // Render mini boards
    function renderBoards(round){
      const cont = $("#boardsContainer").empty();
      const games = tournaments[currentEvent].gamesByRound[round]||[];
      if(!games.length) return cont.text("Нет партий");
      games.forEach((g,i)=>{
        const cid = `cb${currentEvent}_${round}_${i}`;
        const card = $(`
          <div class="board-card">
            <div id="${cid}" style="width:240px;height:240px"></div>
            <div class="info">
              Белые: ${g.tags.White||"?"}<br>
              Чёрные: ${g.tags.Black||"?"}<br>
              Результат: ${g.tags.Result||"*"}
            </div>
          </div>
        `).appendTo(cont);
        g.board = Chessboard(cid,{
          draggable:false,
          position:g.chess.fen(),
          pieceTheme
        });
        card.on("click",()=>openModal(g));
      });
    }

    // Modal logic
    let modalChess, modalBoard, currentGame, modalIdx=0;
    function openModal(game){
      currentGame = game;
      modalChess = new Chess();
      modalBoard = modalBoard || Chessboard("modalBoard",{
        draggable:false,position:"start",pieceTheme
      });
      modalChess.reset();
      modalBoard.start(false);
      modalIdx = 0;
      $("#notation").empty();
      game.moves.forEach((mv,idx)=>{
        $("#notation").append(`<span class="move" data-idx="${idx}">${mv}</span>`);
      });
      $(".move").on("click",e=>jump(+e.target.dataset.idx));
      $("#modal").addClass("show");
      jump(0);
    }
    $("#closeModal").on("click",()=>$("#modal").removeClass("show"));
    $("#prevBtn").on("click",()=>jump(modalIdx-2));
    $("#nextBtn").on("click",()=>jump(modalIdx));

    function jump(idx){
      if(idx<0||idx>currentGame.moves.length) return;
      modalIdx = idx;
      modalChess.reset();
      for(let i=0;i<idx;i++) modalChess.move(currentGame.moves[i]);
      modalBoard.position(modalChess.fen(),false);
      $(".move").removeClass("active");
      $(`.move[data-idx=${idx-1}]`).addClass("active");
    }

    // Live updates
    async function liveUpdate(){
      for(let u of PGN_URLS){
        try{
          const txt = await fetch(PROXY+encodeURIComponent(u),{cache:'no-store'}).then(r=>r.text());
          const updated = parsePGN(txt);
          const evIdx = PGN_URLS.indexOf(u);
          tournaments[evIdx] = updated;
          // if current event & round, refresh boards
          const round = $("#roundSelector").val();
          if(evIdx===currentEvent) renderBoards(round);
          // if modal open on this game, append new moves
          if(currentGame && updated.gamesByRound){
            // find this game in updated by matching tags?
            // For simplicity, skip modal-live-update
          }
        }catch(e){}
      }
    }
    setInterval(liveUpdate,2000);

    // initialize
    await loadAll();
  })();
  </script>
</body>
</html>
