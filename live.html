<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chess Viewer</title>
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous"/>
  <style>
    body { margin:0; padding:20px; font-family:sans-serif; text-align:center; }
    #eventTitle { font-size:24px; font-weight:bold; margin-bottom:8px; }
    #eventInfo { font-size:16px; margin-bottom:12px; }
    #roundSelector { font-size:16px; margin-bottom:16px; padding:6px 12px; }
    .board-container { display:inline-block; margin:10px; vertical-align:top; cursor:pointer; }
    .chessboard { width:300px; }
    .game-info { text-align:left; font-size:14px; margin-top:6px; }
    .game-info b { width:70px; display:inline-block; }
    #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
             background:rgba(0,0,0,0.7); align-items:center; justify-content:center; }
    .modal-content { position:relative; background:#f9f9f9; padding:20px; width:360px;
                     border-radius:5px; text-align:center; z-index:1000; }
    #closeModal { position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; z-index:1001; }
    #modalBoard { width:300px; margin:auto; }
    .controls { margin-top:12px; }
    .controls button { padding:6px 12px; margin:0 8px; font-size:16px; }
    #notation { margin-top:12px; text-align:left; max-height:200px; overflow-y:auto;
                border-top:1px solid #ccc; padding-top:10px; font-size:14px; }
    #notation div.current { background: #ffff99; }
  </style>
</head>
<body>
  <div id="eventTitle">Загрузка…</div>
  <div id="eventInfo">
    CCL. Петровский Путевой Дворец. На разряд: рейтинг до 1550 ФШР, 2009 г.р. и моложе.
  </div>

  <!-- Селект выбора тура -->
  <select id="roundSelector"></select>

  <div id="boardsContainer">Загрузка партий…</div>

  <!-- Модалка -->
  <div id="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <div id="modalBoard"></div>
      <div class="controls">
        <button id="prevBtn">Назад</button>
        <button id="nextBtn">Вперед</button>
      </div>
      <div id="notation"></div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"
          crossorigin="anonymous"></script>
  <script>
    const PGN_URL    = "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament";
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";
    const pieceTheme = "https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png";

    let allGamesByRound = {}, modalBoard, modalChess, modalMoves = [], modalIdx = 0;

    // 1) Скачиваем PGN через прокси
    async function fetchPGN() {
      const res = await fetch(CORS_PROXY + encodeURIComponent(PGN_URL), { cache: 'no-store' });
      return await res.text();
    }

    // 2) Парсим PGN и группируем по Round
    function parsePGN(pgn) {
      allGamesByRound = {};
      // Разбиваем блоки по пустой строке перед тегом [
      const blocks = pgn.trim().split(/\r?\n\s*\r?\n(?=\[)/);

      blocks.forEach(block => {
        const [tagsBlk, movesBlk] = block.split(/\r?\n\r?\n/);
        if (!movesBlk) return;
        const tags = {};
        tagsBlk.split(/\r?\n/).forEach(line => {
          const m = line.match(/^\[([\w]+)\s+"(.+)"\]$/);
          if (m) tags[m[1]] = m[2];
        });
        const round = tags.Round || "?";
        const clean = movesBlk
          .replace(/\{[^}]*\}/g, "")
          .replace(/\([^)]*\)/g, "")
          .replace(/\d+\.{1,3}/g, "")
          .replace(/1-0|0-1|1\/2-1\/2|\*/g, "")
          .trim();
        const arr   = clean ? clean.split(/\s+/) : [];
        const chess = new Chess();
        arr.forEach(m => chess.move(m));

        if (!allGamesByRound[round]) allGamesByRound[round] = [];
        allGamesByRound[round].push({ tags, moves: arr, chess });
      });
    }

    // 3) Рисуем селект и вешаем обработчик
    function renderRoundSelector() {
      const sel    = $("#roundSelector").empty();
      const rounds = Object.keys(allGamesByRound)
                           .filter(r => r !== "?")
                           .sort((a,b) => Number(a) - Number(b));
      rounds.forEach(r => sel.append(`<option value="${r}">Тур ${r}</option>`));

      const last = rounds[rounds.length - 1];
      sel.val(last);
      sel.on("change", () => renderBoards(sel.val()));
      renderBoards(last);
    }

    // 4) Отрисовываем доски выбранного тура
    function renderBoards(round) {
      const cont = $("#boardsContainer").empty();
      const list = allGamesByRound[round] || [];
      list.forEach((g, i) => {
        const id  = `r${round}-${i}`;
        const html = $(`
          <div class="board-container">
            <div id="board${id}" class="chessboard"></div>
            <div class="game-info">
              <b>Белые:</b> ${g.tags.White || "?"}<br>
              <b>Чёрные:</b> ${g.tags.Black || "?"}<br>
              <b>Результат:</b> ${g.tags.Result || "*"}
            </div>
          </div>
        `);
        cont.append(html);
        g.board = Chessboard(`board${id}`, {
          position: g.chess.fen(),
          pieceTheme,
          draggable: false
        });
        html.click(() => openModal(g));
      });
      $("#eventTitle").text(list[0]?.tags.Event || "Шахматный турнир");
    }

    // 5) Модалка для просмотра ходов + нотация
    function openModal(game) {
      modalChess = new Chess();
      modalMoves = [...game.moves];
      modalIdx   = 0;

      // Отрисовать доску
      if (!modalBoard) {
        modalBoard = Chessboard("modalBoard", {
          position: "start",
          pieceTheme,
          draggable: false,
          moveSpeed: 300
        });
      } else {
        modalChess.reset();
        modalBoard.start(false);
      }

      // Построить нотацию
      const notationDiv = $("#notation").empty();
      for (let i = 0; i < modalMoves.length; i += 2) {
        const num   = Math.floor(i/2) + 1;
        const white = modalMoves[i]   || "";
        const black = modalMoves[i+1] || "";
        notationDiv.append(`<div data-index="${i}">${num}. ${white} ${black}</div>`);
      }

      // Показать модалку
      $("#modal").fadeIn(100);
    }
    function closeModal() { $("#modal").fadeOut(100); }

    function highlightMove(idx) {
      $("#notation div").removeClass("current");
      $(`#notation div[data-index="${idx}"]`).addClass("current")[0]?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function nextMove() {
      if (modalIdx < modalMoves.length) {
        modalChess.move(modalMoves[modalIdx]);
        modalIdx++;
        modalBoard.position(modalChess.fen(), true);
        highlightMove(modalIdx - 1);
      }
    }
    function prevMove() {
      if (modalIdx > 0) {
        modalChess.undo();
        modalIdx--;
        modalBoard.position(modalChess.fen(), true);
        highlightMove(modalIdx);
      }
    }

    // 6) Старт после загрузки
    $(async () => {
      try {
        const pgn = await fetchPGN();
        parsePGN(pgn);
        renderRoundSelector();
      } catch (err) {
        console.error(err);
        $("#boardsContainer").text("Ошибка загрузки PGN");
      }
      $("#closeModal").click(closeModal);
      $("#prevBtn").click(prevMove);
      $("#nextBtn").click(nextMove);
    });
  </script>
</body>
</html>
