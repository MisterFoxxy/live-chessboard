<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chess Multi-Tournament Viewer</title>
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous"/>
  <style>
    body { margin:0; padding:20px; font-family:sans-serif; text-align:center; }
    select { font-size:16px; margin:0 8px 16px; padding:6px 12px; }
    #eventTitle { font-size:24px; font-weight:bold; margin-bottom:8px; }
    .board-container { display:inline-block; margin:10px; vertical-align:top; cursor:pointer; }
    .chessboard { width:300px; }
    .game-info { text-align:left; font-size:14px; margin-top:6px; }
    .game-info b { width:70px; display:inline-block; }
    #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
             background:rgba(0,0,0,0.7); align-items:center; justify-content:center; }
    .modal-content { position:relative; background:#fff; padding:20px; width:380px;
                     border-radius:5px; text-align:center; z-index:1000; }
    #closeModal { position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; }
    #modalBoard { width:300px; margin:auto; }
    .controls { margin-top:12px; }
    .controls button { padding:6px 12px; margin:0 8px; font-size:16px; }
    #notation {
      margin-top:12px; text-align:left; max-height:200px; overflow-y:auto;
      display:flex; flex-wrap: wrap; gap:6px; font-size:14px; padding:8px;
      border-top:1px solid #ccc;
    }
    #notation span {
      cursor:pointer; padding:2px 4px; border-radius:3px; background:#f0f0f0;
    }
    #notation span.current { background:#ffff99; }
  </style>
</head>
<body>
  <div>
    <select id="eventSelector"></select>
    <select id="roundSelector"></select>
  </div>
  <div id="boardsContainer">Загрузка партий…</div>

  <!-- Модалка -->
  <div id="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <div id="modalBoard"></div>
      <div class="controls">
        <button id="prevBtn">Назад</button>
        <button id="nextBtn">Вперед</button>
      </div>
      <div id="notation"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"
          crossorigin="anonymous"></script>
  <script>
    const PGN_SOURCES = [
      "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament",
      "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7eJEJl1DyD2DNu7IxZBAlKBDIdkh314Cbjc6u_5jGnbAsw3Z?type=tournament"
    ];
    const CORS_PROXY  = "https://api.allorigins.win/raw?url=";
    const pieceTheme  = "https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png";

    let tournaments = [];       // { event, gamesByRound }
    let currentIdx  = 0;
    let modalBoard, modalChess, modalMoves = [], modalIdx = 0;

    async function fetchPGN(url) {
      const res = await fetch(CORS_PROXY + encodeURIComponent(url), { cache: 'no-store' });
      return await res.text();
    }

    function parsePGNtoTournament(pgn) {
      // разбить на блоки любой тег
      const blocks = pgn.trim().split(/\r?\n\s*\r?\n(?=\[)/);
      let gamesByRound = {};
      let eventName = "";

      blocks.forEach(block => {
        const [tagsBlk, movesBlk] = block.split(/\r?\n\r?\n/);
        if (!movesBlk) return;
        let tags = {};
        tagsBlk.split(/\r?\n/).forEach(line => {
          let m = line.match(/^\[([\w]+)\s+"(.+)"\]$/);
          if (m) tags[m[1]] = m[2];
        });
        if (!eventName && tags.Event) eventName = tags.Event;
        const round = tags.Round || "?";
        // чистка ходов
        let clean = movesBlk
          .replace(/\{[^}]*\}/g, "")
          .replace(/\([^)]*\)/g, "")
          .replace(/\d+\.{1,3}/g, "")
          .replace(/1-0|0-1|1\/2-1\/2|\*/g, "")
          .trim();
        let arr = clean ? clean.split(/\s+/) : [];
        let chess = new Chess();
        arr.forEach(mv => chess.move(mv));
        if (!gamesByRound[round]) gamesByRound[round] = [];
        gamesByRound[round].push({ tags, moves: arr, chess });
      });

      return { event: eventName, gamesByRound };
    }

    function renderEventSelector() {
      const sel = $("#eventSelector").empty();
      tournaments.forEach((t, i) => {
        sel.append(`<option value="${i}">${t.event}</option>`);
      });
      sel.val(currentIdx);
      sel.on("change", () => {
        currentIdx = +sel.val();
        renderRoundSelector();
      });
    }

    function renderRoundSelector() {
      const rounds = Object.keys(tournaments[currentIdx].gamesByRound)
                           .filter(r => r !== "?")
                           .sort((a,b)=>Number(a)-Number(b));
      const sel = $("#roundSelector").empty();
      rounds.forEach(r => sel.append(`<option value="${r}">Тур ${r}</option>`));
      let last = rounds[rounds.length-1];
      sel.val(last);
      sel.on("change", ()=> renderBoards(sel.val()));
      renderBoards(last);
    }

    function renderBoards(round) {
      const list = tournaments[currentIdx].gamesByRound[round] || [];
      const cont = $("#boardsContainer").empty();
      list.forEach((g,i) => {
        const id = `t${currentIdx}r${round}i${i}`;
        const html = $(`
          <div class="board-container">
            <div id="board${id}" class="chessboard"></div>
            <div class="game-info">
              <b>Белые:</b> ${g.tags.White||"?"}<br>
              <b>Чёрные:</b> ${g.tags.Black||"?"}<br>
              <b>Результат:</b> ${g.tags.Result||"*"}
            </div>
          </div>`);
        cont.append(html);
        g.board = Chessboard(`board${id}`, {
          position: g.chess.fen(),
          pieceTheme, draggable:false
        });
        html.click(()=>openModal(g));
      });
      $("#eventTitle").text(tournaments[currentIdx].event);
    }

    function openModal(game) {
      modalChess = new Chess();
      modalMoves = [...game.moves];
      modalIdx   = 0;
      if (!modalBoard) {
        modalBoard = Chessboard("modalBoard", {
          position:"start", pieceTheme, draggable:false, moveSpeed:300
        });
      } else {
        modalChess.reset();
        modalBoard.start(false);
      }
      const notationDiv = $("#notation").empty();
      modalMoves.forEach((mv, idx)=>{
        const lbl = (idx%2===0)?`${Math.floor(idx/2)+1}.`:"";
        notationDiv.append(`<span data-index="${idx}">${lbl}${mv}</span>`);
      });
      $("#notation span").click(function(){
        goToMove(+this.dataset.index);
      });
      $("#modal").fadeIn(150);
      highlightMove(-1);
    }

    function closeModal(){ $("#modal").fadeOut(150); }
    function highlightMove(idx){
      $("#notation span").removeClass("current");
      if(idx>=0){
        const el = $(`#notation span[data-index="${idx}"]`);
        el.addClass("current")[0].scrollIntoView({behavior:"smooth",block:"nearest"});
      }
    }
    function goToMove(idx){
      modalChess.reset();
      modalBoard.start(false);
      for(let i=0;i<=idx;i++) modalChess.move(modalMoves[i]);
      modalBoard.position(modalChess.fen(),true);
      modalIdx = idx+1;
      highlightMove(idx);
    }
    function nextMove(){
      if(modalIdx<modalMoves.length){
        modalChess.move(modalMoves[modalIdx]);
        modalIdx++;
        modalBoard.position(modalChess.fen(),true);
        highlightMove(modalIdx-1);
      }
    }
    function prevMove(){
      if(modalIdx>0){
        modalChess.undo();
        modalIdx--;
        modalBoard.position(modalChess.fen(),true);
        highlightMove(modalIdx-1);
      }
    }

    $(async()=>{
      try {
        // загрузка обоих PGN
        for(let url of PGN_SOURCES){
          let pgn = await fetchPGN(url);
          tournaments.push(parsePGNtoTournament(pgn));
        }
        renderEventSelector();
        renderRoundSelector();
      } catch(e){
        console.error(e);
        $("#boardsContainer").text("Ошибка загрузки PGN");
      }
      $("#closeModal").click(closeModal);
      $("#prevBtn").click(prevMove);
      $("#nextBtn").click(nextMove);
    });
  </script>
</body>
</html>
