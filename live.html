<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Live‑PGN — тур 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Стили chessboard.js -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .board-wrapper {
      display: inline-block;
      margin: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 300px;
      cursor: pointer;
    }
    .board-wrapper h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .board {
      width: 280px;
      margin: auto 0;
    }
    .players {
      margin-top: 8px;
      font-size: 14px;
      text-align: left;
      line-height: 1.4;
    }
    .players b { display: inline-block; width: 60px; }

    /* Модальное окно */
    #modal-overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      width: 350px;
      position: relative;
    }
    #modal-close {
      position: absolute;
      top: 8px; right: 12px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }
    #modal-board { width: 300px; margin: auto; }
    #modal-controls {
      margin-top: 12px;
    }
    #modal-controls button {
      font-size: 18px;
      padding: 4px 12px;
      margin: 0 10px;
    }
    #move-counter { font-size: 16px; }
  </style>
</head>
<body>

  <h2>Все доски тура 1 (кликните по доске для просмотра ходов)</h2>
  <div id="boards-container"></div>

  <!-- Модальное окно -->
  <div id="modal-overlay">
    <div id="modal-content">
      <button id="modal-close">&times;</button>
      <div id="modal-board"></div>
      <div id="modal-controls">
        <button id="prev-move">&larr;</button>
        <span id="move-counter">0/0</span>
        <button id="next-move">&rarr;</button>
      </div>
    </div>
  </div>

  <!-- зависимости -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    const PGN_URL = "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament";
    const container = document.getElementById('boards-container');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalBoardDiv = document.getElementById('modal-board');
    const moveCounter = document.getElementById('move-counter');

    const gamesMap = {};
    let modalChess, modalBoard, modalMovesVerbose, modalIndex;

    function parseGames(text) {
      return text.split(/\n(?=\[TimeControl)/g).map(s => s.trim()).filter(Boolean);
    }

    function parseHeaders(pgn) {
      const H = {};
      pgn.split('\n').forEach(l => {
        const m = l.match(/^\[(\w+)\s+"(.+)"\]/);
        if (m) H[m[1]] = m[2];
      });
      return H;
    }

    async function updateAll() {
      try {
        const res = await fetch(PGN_URL, { cache: 'no-store' });
        const txt = await res.text();
        const chunks = parseGames(txt);

        chunks.forEach(chunk => {
          const hdr = parseHeaders(chunk);
          if (hdr.Round !== "1") return;
          const boardId = hdr.Board.trim();

          if (!gamesMap[boardId]) {
            const wrap = document.createElement('div');
            wrap.className = 'board-wrapper';
            wrap.onclick = () => openModal(boardId);

            const title = document.createElement('h3');
            title.textContent = `Доска ${boardId}`;
            wrap.appendChild(title);

            const boardDiv = document.createElement('div');
            boardDiv.id = `board-${boardId}`;
            boardDiv.className = 'board';
            wrap.appendChild(boardDiv);

            const playersDiv = document.createElement('div');
            playersDiv.id = `players-${boardId}`;
            playersDiv.className = 'players';
            wrap.appendChild(playersDiv);

            container.appendChild(wrap);

            const chess = new Chess();
            const board = Chessboard(boardDiv.id, {
              draggable: false,
              position: 'start',
              pieceTheme: 'https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png'
            });

            gamesMap[boardId] = { chess, board, playersDiv, pgn: chunk, lastCount: 0 };
          }

          const g = gamesMap[boardId];
          g.chess.load_pgn(g.pgn);
          g.board.position(g.chess.fen());

          const count = g.chess.history().length;
          if (count !== g.lastCount) {
            const w = hdr.White || "—";
            const b = hdr.Black || "—";
            const r = hdr.Result || "*";
            g.playersDiv.innerHTML =
              `<div><b>White:</b> ${w}</div>` +
              `<div><b>Black:</b> ${b}</div>` +
              `<div><b>Result:</b> ${r}</div>`;
            g.lastCount = count;
          }
        });
      } catch (err) {
        console.error("Ошибка загрузки PGN:", err);
      }
    }

    function openModal(boardId) {
      const g = gamesMap[boardId];
      modalMovesVerbose = g.chess.history({ verbose: true });
      modalIndex = 0;

      if (!modalBoard) {
        modalChess = new Chess();
        modalBoard = Chessboard(modalBoardDiv.id, {
          draggable: false,
          position: 'start',
          pieceTheme: g.board.getConfig().pieceTheme
        });
      } else {
        modalChess.reset();
        modalBoard.position(modalChess.fen(), false);
      }

      moveCounter.textContent = `0/${modalMovesVerbose.length}`;
      modalOverlay.style.display = 'flex';
    }

    document.getElementById('next-move').onclick = () => {
      if (modalIndex < modalMovesVerbose.length) {
        const m = modalMovesVerbose[modalIndex];
        modalChess.move(m.san);
        modalBoard.move(`${m.from}-${m.to}`);  // плавная анимация
        modalIndex++;
        moveCounter.textContent = `${modalIndex}/${modalMovesVerbose.length}`;
      }
    };

    document.getElementById('prev-move').onclick = () => {
      if (modalIndex > 0) {
        modalIndex--;
        modalChess.reset();
        for (let i = 0; i < modalIndex; i++) {
          modalChess.move(modalMovesVerbose[i].san);
        }
        modalBoard.position(modalChess.fen(), false);  // без анимации
        moveCounter.textContent = `${modalIndex}/${modalMovesVerbose.length}`;
      }
    };

    document.getElementById('modal-close').onclick = () => {
      modalOverlay.style.display = 'none';
    };

    // Запуск и авто‑обновление
    updateAll();
    setInterval(updateAll, 5000);
  </script>
</body>
</html>
