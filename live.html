<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Live‑PGN — тур 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Стили chessboard.js -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"
    integrity="sha512-+sFGZHs3WGkJiPqJgMeiY8MY2YT1jFQOKOBlmc+GTPDM7n0eRZKyy4hO1x+jVHnMf0dwEZmfzzn3KJGOXMsivg=="
    crossorigin="anonymous"
  />
  <style>
    body { font-family: Arial, sans-serif; padding:20px; text-align:center; }
    .board-wrapper {
      display:inline-block; margin:8px; padding:8px;
      border:1px solid #ccc; border-radius:4px; width:280px;
      cursor:pointer;
    }
    .board-wrapper h3 { margin:0 0 8px; font-size:18px; }
    .board-static { width: 260px; margin:auto; }
    .players { text-align:left; font-size:14px; margin-top:6px; }
    .players b { display:inline-block; width:60px; }

    /* Модалка */
    #modal-overlay {
      position:fixed; top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.5); display:none;
      align-items:center; justify-content:center; z-index:1000;
    }
    #modal-content {
      background:#fff; padding:16px; border-radius:6px;
      text-align:center; width:340px; position:relative;
    }
    #modal-close {
      position:absolute; top:8px; right:12px;
      border:none; background:transparent; font-size:20px; cursor:pointer;
    }
    #modal-board { width:300px; margin:auto; }
    #modal-controls { margin-top:12px; }
    #modal-controls button {
      font-size:18px; padding:4px 10px; margin:0 8px;
    }
    #move-counter { font-size:16px; }
  </style>
</head>
<body>

  <h2>Все доски тура 1 (клик — открыть просмотр ходов)</h2>
  <div id="boards-container"></div>

  <!-- Модальное окно -->
  <div id="modal-overlay">
    <div id="modal-content">
      <button id="modal-close">&times;</button>
      <div id="modal-board"></div>
      <div id="modal-controls">
        <button id="prev-move">&larr;</button>
        <span id="move-counter">0/0</span>
        <button id="next-move">&rarr;</button>
      </div>
    </div>
  </div>

  <!-- зависимости -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
    integrity="sha512-894YeJO0G+h7TvT9Gk5K5nLMwNLD69Npy4HI+N0Y+MZv8vYpHvP+0QlZ6hIW9Ebm4W9Lk+Q2j2I0ohXWqjGa3g=="
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"
    integrity="sha512-/9l4MnGFYLn3KH1PGvcPIk9kS0/s3pZrzM0P65uwkjNZElrt2uGQ9+HWk6NiJlIn0YuJ0Xo/qULpq5VoW4rXkw=="
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"
    integrity="sha512-PbdhQhgp2ULgk+WT3XAsgKJNCryPpBkx/BoQ3xhnU3rjv0zKBXdvQbAzbhkNlXBvaw0EBNTVK3TSfJjdXd8Ghg=="
    crossorigin="anonymous"
  ></script>

  <script>
  (async ()=>{
    const PGN_URL = "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament";
    const text = await fetch(PGN_URL, {cache:'no-store'}).then(r=>r.text());
    const chunks = text.split(/\n(?=\[TimeControl)/g).map(s=>s.trim()).filter(Boolean);

    // Формируем мапы
    const pgnMap = {}, headersMap = {}, fenMap = {};
    chunks.forEach(chunk=>{
      const hdr = {};
      chunk.split('\n').forEach(l=>{
        const m = l.match(/^\[(\w+)\s+"(.+)"\]/);
        if(m) hdr[m[1]] = m[2];
      });
      if(hdr.Round==="1"){
        const id=hdr.Board.trim();
        pgnMap[id]=chunk;
        headersMap[id]=hdr;
        const chess=new Chess(); chess.load_pgn(chunk);
        fenMap[id]=chess.fen();
      }
    });

    // Рендерим статичные доски
    const container=document.getElementById('boards-container');
    Object.keys(pgnMap).forEach(id=>{
      const hdr=headersMap[id];
      const wrap=document.createElement('div');
      wrap.className='board-wrapper';
      wrap.addEventListener('click',()=>openModal(id));

      wrap.innerHTML=`
        <h3>Доска ${id}</h3>
        <div id="static-${id}" class="board-static"></div>
        <div class="players">
          <div><b>White:</b> ${hdr.White||'—'}</div>
          <div><b>Black:</b> ${hdr.Black||'—'}</div>
          <div><b>Result:</b> ${hdr.Result||'*'}</div>
        </div>`;
      container.appendChild(wrap);

      // создаём Chessboard для статической позиции
      Chessboard(`static-${id}`, {
        draggable:false,
        position:fenMap[id],
        pieceTheme:'https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png'
      });
    });

    // Модалка
    const overlay = document.getElementById('modal-overlay');
    const modalBoardDiv = document.getElementById('modal-board');
    const moveCounter = document.getElementById('move-counter');
    document.getElementById('modal-close').onclick=()=>overlay.style.display='none';

    let modalChess, modalBoard, modalMovesVerbose, modalIndex;
    function openModal(id){
      // инициализируем модалку
      modalMovesVerbose = new Chess().load_pgn(pgnMap[id]) && new Chess().history({verbose:true});
      // но chess.load_pgn() возвращает boolean, поэтому:
      modalChess=new Chess(); modalChess.load_pgn(pgnMap[id]);
      modalMovesVerbose = modalChess.history({verbose:true});
      modalIndex=0;
      if(!modalBoard){
        modalBoard=Chessboard(modalBoardDiv.id,{
          draggable:false,
          position:'start',
          pieceTheme:'https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png'
        });
      } else {
        modalChess.reset(); modalBoard.position(modalChess.fen(),false);
      }
      moveCounter.textContent=`0/${modalMovesVerbose.length}`;
      overlay.style.display='flex';
    }

    document.getElementById('next-move').onclick=()=>{
      if(modalIndex<modalMovesVerbose.length){
        const m=modalMovesVerbose[modalIndex];
        modalChess.move(m.san);
        modalBoard.move(`${m.from}-${m.to}`);
        modalIndex++;
        moveCounter.textContent=`${modalIndex}/${modalMovesVerbose.length}`;
      }
    };
    document.getElementById('prev-move').onclick=()=>{
      if(modalIndex>0){
        modalIndex--;
        modalChess.reset();
        for(let i=0;i<modalIndex;i++) modalChess.move(modalMovesVerbose[i].san);
        modalBoard.position(modalChess.fen(),false);
        moveCounter.textContent=`${modalIndex}/${modalMovesVerbose.length}`;
      }
    };
  })();
  </script>

</body>
</html>
