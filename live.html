<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chess Round 1</title>
  <!-- Chessboard.js CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
        crossorigin="anonymous">
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .board-container { display: inline-block; margin: 10px; text-align: center; vertical-align: top; cursor: pointer; }
    .chessboard { width: 300px; }
    .game-info { font-size: 14px; margin-top: 6px; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
             background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
    .modal-content { position: relative; background: #f9f9f9; padding: 20px; border-radius: 5px; text-align: center; }
    #closeModal { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; cursor: pointer; }
    #closeModal:hover { color: #444; }
    #modalBoard { width: 300px; margin: auto; }
    .controls { margin-top: 12px; }
    .controls button { padding: 6px 12px; margin: 0 8px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="boardsContainer">Загрузка партий...</div>

  <!-- Modal for move navigation -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <div id="modalBoard"></div>
      <div class="controls">
        <button id="prevBtn">&larr; Prev</button>
        <button id="nextBtn">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Libraries: jQuery, Chessboard.js, Chess.js (via CDN) -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
          integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
          integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"
          integrity="sha512-ujGsB4vTyNcSuViwM2DJ0+G2BIViQJl2rVBZBekStznA9Hq96+Wd9+jwu9zlttp0U2/9CYhgR7pOt2j+E6yewg=="
          crossorigin="anonymous"></script>

  <script>
    const PGN_URL = "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament";
    const UPDATE_INTERVAL = 5000; // 5 seconds
    const pieceThemePath = "https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png";

    let gamesData = [], modalBoard = null, modalChess = null, modalMoves = [], modalMoveIndex = 0;

    function parsePGNandInitGames(pgnText) {
      gamesData = [];
      const sections = pgnText.trim().split(/\r?\n\r?\n(?=\[TimeControl)/);
      sections.forEach(section => {
        const parts = section.split(/\r?\n\r?\n/);
        if (parts.length < 2) return;
        const tagsText = parts[0], movesText = parts[1];
        const tags = {};
        tagsText.split(/\r?\n/).forEach(line => {
          const m = line.match(/^\[([\w]+)\s+"(.+)"\]$/);
          if (m) tags[m[1]] = m[2];
        });
        if (tags.Round !== "1") return;
        let mv = movesText.replace(/\{[^}]*\}/g,"").replace(/\([^)]*\)/g,"")
                          .replace(/\d+\.{1,3}/g,"")
                          .replace(/1-0|0-1|1\/2-1\/2|\*/g,"")
                          .trim();
        const mvArr = mv ? mv.split(/\s+/) : [];
        const chess = new Chess();
        mvArr.forEach(m => chess.move(m));
        gamesData.push({ tags, moves: mvArr, chess, board: null });
      });
    }

    function renderBoards() {
      const container = document.getElementById("boardsContainer");
      container.innerHTML = "";
      gamesData.forEach((game, idx) => {
        const div = document.createElement("div");
        div.className = "board-container";
        div.innerHTML = `
          <div id="board${idx}" class="chessboard"></div>
          <div class="game-info">
            White: ${game.tags.White || "?"}<br>
            Black: ${game.tags.Black || "?"}<br>
            Result: ${game.tags.Result || "*"}
          </div>`;
        container.appendChild(div);
        const board = Chessboard(`board${idx}`, {
          position: game.chess.fen(),
          pieceTheme: pieceThemePath,
          draggable: false
        });
        game.board = board;
        div.addEventListener("click", () => openModal(idx));
      });
    }

    function loadInitialData() {
      fetch(PGN_URL).then(r=>r.text()).then(txt=>{
        parsePGNandInitGames(txt);
        renderBoards();
      });
    }

    function setupAutoUpdate() {
      setInterval(()=>{
        fetch(PGN_URL).then(r=>r.text()).then(txt=>{
          const sections = txt.trim().split(/\r?\n\r?\n(?=\[TimeControl)/);
          sections.forEach(section=>{
            const parts = section.split(/\r?\n\r?\n/);
            if (parts.length<2) return;
            const tags = {};
            parts[0].split(/\r?\n/).forEach(l=>{
              const m = l.match(/^\[([\w]+)\s+"(.+)"\]$/);
              if(m) tags[m[1]] = m[2];
            });
            if (tags.Round!=="1") return;
            const idx = parseInt(tags.Board,10)-1;
            if (!gamesData[idx]) return;
            let mv = parts[1].replace(/\{[^}]*\}/g,"").replace(/\([^)]*\)/g,"")
                             .replace(/\d+\.{1,3}/g,"")
                             .replace(/1-0|0-1|1\/2-1\/2|\*/g,"")
                             .trim();
            const newMoves = mv?mv.split(/\s+/):[];
            const game = gamesData[idx];
            if (newMoves.length>game.moves.length) {
              newMoves.slice(game.moves.length).forEach(m=>game.chess.move(m));
              game.moves=newMoves;
              game.board.position(game.chess.fen(), false);
            }
          });
        });
      }, UPDATE_INTERVAL);
    }

    function openModal(idx) {
      const game = gamesData[idx];
      modalChess = new Chess();
      modalMoves = game.moves.slice();
      modalMoveIndex = 0;
      if (!modalBoard) {
        modalBoard = Chessboard("modalBoard", {
          position: "start",
          pieceTheme: pieceThemePath,
          draggable: false,
          moveSpeed: 300
        });
      } else {
        modalChess.reset();
        modalBoard.start(false);
      }
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function nextMove() {
      if (modalMoveIndex>=modalMoves.length) return;
      modalChess.move(modalMoves[modalMoveIndex++]);
      modalBoard.position(modalChess.fen(), true);
    }

    function prevMove() {
      if (modalMoveIndex<=0) return;
      modalChess.undo();
      modalMoveIndex--;
      modalBoard.position(modalChess.fen(), true);
    }

    // hookup controls
    window.onload = () => {
      loadInitialData();
      setupAutoUpdate();
      document.getElementById("closeModal").onclick = closeModal;
      document.getElementById("nextBtn").onclick   = nextMove;
      document.getElementById("prevBtn").onclick   = prevMove;
    };
  </script>
</body>
</html>
