<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Live Chess Multi-Tournament Viewer</title>
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
        crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
        rel="stylesheet"/>
  <style>
    :root {
      --bg-page: #f4f5f7;
      --card-bg: #fff;
      --accent: #4a90e2;
      --text-main: #333;
      --text-light: #666;
      --radius: 8px;
      --transition: .2s;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;padding:20px;
      background:var(--bg-page);
      font-family:'Inter',sans-serif;
      color:var(--text-main);
    }
    header {
      display:flex;flex-wrap:wrap;
      justify-content:center;gap:1rem;
      margin-bottom:16px;
    }
    select {
      appearance:none;
      background:var(--card-bg)
        url("data:image/svg+xml;charset=UTF-8,<svg fill='%23666' height='24' viewBox='0 0 24 24' width='24'><path d='M7 10l5 5 5-5z'/></svg>")
        no-repeat right 12px center;
      padding:8px 32px 8px 12px;
      border:1px solid #ccc;border-radius:var(--radius);
      font-size:16px;color:var(--text-main);
      transition:border-color var(--transition);
      max-width:300px; width:100%;
    }
    select:focus {outline:none;border-color:var(--accent);}
    #boardsContainer {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:20px;
    }
    .card {
      background:var(--card-bg);
      border-radius:var(--radius);
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
      overflow:hidden;
      transition:transform var(--transition),box-shadow var(--transition);
      cursor:pointer;
    }
    .card:hover {
      transform:scale(1.02);
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }
    .board-name{
      font-weight:600;
      margin:12px 0 8px;
      text-align:center;
      font-size:16px;
    }
    .game-info {
      padding:12px;
      font-size:14px;
      text-align:left;
      color:var(--text-light);
    }
    #modal {
      display:none;
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(4px);
      align-items:center;justify-content:center;
      opacity:0;transition:opacity var(--transition);
      overflow:auto;padding:20px;
    }
    #modal.show{display:flex;opacity:1;}
    #closeModal{
      position:fixed;top:16px;right:16px;
      font-size:32px;color:var(--card-bg);
      text-shadow:0 0 4px rgba(0,0,0,0.5);
      cursor:pointer;z-index:1002;
    }
    #modalContent{
      background:var(--card-bg);
      border-radius:var(--radius);
      padding:20px;
      position:relative;
      width:400px;max-width:100%;
      max-height:90vh;
      overflow:auto;
      text-align:center;
      z-index:1001;
    }
    .chessboard{width:300px;margin:auto;}
    .controls{
      margin-top:12px;
      display:flex;justify-content:center;gap:8px;
    }
    .controls button{padding:6px 12px;font-size:16px;}
    #notation {
      margin-top:12px;
      white-space:nowrap;
      overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      scroll-snap-type:x mandatory;
    }
    #notation::-webkit-scrollbar{display:none;}
    #notation .move{
      display:inline-block;
      scroll-snap-align:center;
      cursor:pointer;
      padding:4px 6px;
      border-radius:4px;
      background:var(--bg-page);
      transition:background var(--transition),color var(--transition);
      margin-right:6px;
    }
    #notation .move.active{
      background:var(--accent);color:#fff;
    }
    @media(max-width:480px){
      header{flex-direction:column;align-items:stretch;}
      select{max-width:none;}
      #boardsContainer{grid-template-columns:1fr!important;}
    }
  </style>
</head>
<body>
<header>
  <select id="eventSelector"></select>
  <select id="roundSelector"></select>
</header>
<div id="boardsContainer"><p>Загрузка…</p></div>

<div id="modal">
  <span id="closeModal">&times;</span>
  <div id="modalContent">
    <div id="modalBoard"></div>
    <div class="controls">
      <button id="prevBtn">← Назад</button>
      <button id="nextBtn">Вперед →</button>
    </div>
    <div id="notation"></div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js" crossorigin="anonymous"></script>
<script>
(async function(){
  const PGN_SOURCES = [
    "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament",
    "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7eJEJl1DyD2DNu7IxZBAlKBDIdkh314Cbjc6u_5jGnbAsw3Z?type=tournament",
    "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXaNY79hEJl1DyD2DNu7IxZBAlKBDIdkhz2xMbjc6u_5jGnbAsw3Z?type=tournament"
  ];
  const CORS_PROXY = "https://api.allorigins.win/raw?url=";
  let tournaments = [], currentIdx = 0;
  let modalBoard, modalChess, modalMoves = [], modalIdx = 0, modalGame = null;

  function parsePGNtoTournament(pgn){
    const blocks = pgn.trim().split(/\r?\n\s*\r?\n(?=\[)/);
    let gamesByRound = {}, event="";
    blocks.forEach(block=>{
      const [tagsBlk,movesBlk] = block.split(/\r?\n\r?\n/);
      if(!movesBlk) return;
      const tags={};
      tagsBlk.split(/\r?\n/).forEach(l=>{
        const m=l.match(/^\[([\w]+)\s+"(.+)"\]$/);
        if(m) tags[m[1]] = m[2];
      });
      if(!event && tags.Event) event=tags.Event;
      const r=tags.Round||"?";
      let clean = movesBlk.replace(/\{[^}]*\}/g,"").replace(/\([^)]*\)/g,"")
        .replace(/\d+\.{1,3}/g,"").replace(/1-0|0-1|1\/2-1\/2|\*/g,"").trim();
      const arr = clean?clean.split(/\s+/):[];
      const chess=new Chess();
      arr.forEach(mv=>chess.move(mv));
      gamesByRound[r] = gamesByRound[r]||[];
      gamesByRound[r].push({tags,moves:arr,chess,board:null});
    });
    return {event,gamesByRound};
  }

  async function fetchPGN(url){
    const res = await fetch(CORS_PROXY+encodeURIComponent(url),{cache:'no-store'});
    if(!res.ok) throw new Error(res.statusText);
    return res.text();
  }

  // Инициализация: загружаем все турниры и рисуем интерфейс
  async function init(){
    try{
      const texts = await Promise.all(PGN_SOURCES.map(fetchPGN));
      tournaments = texts.map(parsePGNtoTournament);
      renderEventSelector();
      renderRoundSelector();
      setInterval(updateTournaments,3000);
    } catch(e){
      console.error("Ошибка загрузки PGN:",e);
      $("#boardsContainer").html("<p>Ошибка загрузки данных</p>");
    }
    $("#closeModal").click(closeModal);
    $("#prevBtn").click(prevMove);
    $("#nextBtn").click(nextMove);
  }

  function renderEventSelector(){
    const sel=$("#eventSelector").empty();
    tournaments.forEach((t,i)=>sel.append(`<option value="${i}">${t.event}</option>`));
    sel.val(currentIdx).on("change",()=>{
      currentIdx=+sel.val();
      renderRoundSelector();
    });
  }

  function renderRoundSelector(){
    const rounds=Object.keys(tournaments[currentIdx].gamesByRound)
      .filter(r=>r!=="?").sort((a,b)=>Number(a)-Number(b));
    const sel=$("#roundSelector").empty();
    rounds.forEach(r=>sel.append(`<option value="${r}">Тур ${r}</option>`));
    sel.val(rounds.slice(-1)[0]).on("change",()=>renderBoards(sel.val()));
    renderBoards(sel.val());
  }

  function renderBoards(round){
    const list=tournaments[currentIdx].gamesByRound[round]||[];
    const cont=$("#boardsContainer").empty();
    list.forEach((g,i)=>{
      const id=`t${currentIdx}r${round}i${i}`;
      const card=$(`<div class="card" data-ti="${currentIdx}" data-round="${round}" data-gi="${i}"></div>`);
      card.append(`<div class="board-name">${g.tags.Board||""}</div>`);
      card.append(`<div id="board${id}" class="chessboard"></div>`);
      card.append(`<div class="game-info">
        <b>Белые:</b>${g.tags.White||"?"}<br>
        <b>Чёрные:</b>${g.tags.Black||"?"}<br>
        <b>Результат:</b>${g.tags.Result||"*"}
      </div>`);
      cont.append(card);
      g.board=Chessboard(`board${id}`,{position:g.chess.fen(),pieceTheme:"https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png",draggable:false});
      card.click(()=>openModal(g,round));
    });
  }

  function openModal(game,round){
    modalGame=game;
    modalChess=new Chess();
    modalMoves=[...game.moves];
    modalIdx=0;
    $("#modal").addClass("show");
    if(!modalBoard){
      modalBoard=Chessboard("modalBoard",{position:"start",pieceTheme:"https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png",draggable:false,moveSpeed:300});
    } else {
      modalChess.reset(); modalBoard.start(false); modalBoard.resize();
    }
    const note=$("#notation").empty()[0];
    modalMoves.forEach((mv,idx)=>{
      const span=document.createElement("span");
      span.className="move"; span.dataset.index=idx;
      span.textContent=(idx%2===0?(Math.floor(idx/2)+1)+".":"")+mv;
      span.onclick=()=>goToMove(idx);
      note.appendChild(span);
    });
    document.onkeydown=e=>{
      if(!$("#modal").hasClass("show")) return;
      if(e.key==="ArrowRight"||e.key===" ") { e.preventDefault(); nextMove(); }
      if(e.key==="ArrowLeft") { e.preventDefault(); prevMove(); }
    };
  }

  function closeModal(){
    $("#modal").removeClass("show");
    document.onkeydown=null;
  }

  function highlightMove(idx){
    $("#notation .move").removeClass("active");
    if(idx>=0){
      const sp=$(`#notation .move[data-index="${idx}"]`);
      sp.addClass("active")[0].scrollIntoView({behavior:"smooth",inline:"center"});
    }
  }

  function goToMove(idx){
    modalChess.reset();
    modalBoard.start(false);
    for(let i=0;i<=idx;i++) modalChess.move(modalMoves[i]);
    modalBoard.position(modalChess.fen(),false);
    modalIdx=idx+1; highlightMove(idx);
  }

  function nextMove(){
    if(modalIdx<modalMoves.length){
      modalChess.move(modalMoves[modalIdx]);
      modalIdx++;
      modalBoard.position(modalChess.fen(),false);
      highlightMove(modalIdx-1);
    }
  }

  function prevMove(){
    if(modalIdx>0){
      modalChess.undo();
      modalIdx--;
      modalBoard.position(modalChess.fen(),false);
      highlightMove(modalIdx-1);
    }
  }

  // Live-обновление: подтягиваем новые ходы и обновляем доски и модалку
  async function updateTournaments(){
    for(let ti=0; ti<PGN_SOURCES.length; ti++){
      try{
        const text=await fetchPGN(PGN_SOURCES[ti]);
        const updated=parsePGNtoTournament(text).gamesByRound;
        const old=tournaments[ti].gamesByRound;
        Object.keys(updated).forEach(round=>{
          (updated[round]||[]).forEach((ng,gi)=>{
            const og=old[round]?.[gi];
            if(!og) return;
            if(ng.moves.length>og.moves.length){
              const added=ng.moves.slice(og.moves.length);
              added.forEach(mv=>{ og.moves.push(mv); og.chess.move(mv); });
              // обновляем мини-доску
              if(ti===currentIdx && round===$("#roundSelector").val()){
                const glist=tournaments[ti].gamesByRound[round];
                const g=glist[gi];
                if(g.board) g.board.position(g.chess.fen(),false);
              }
              // обновляем модалку
              if($("#modal").hasClass("show") && modalGame===og){
                added.forEach((mv,i)=>{
                  const idx=og.moves.length-added.length+i;
                  modalMoves.push(mv);
                  const span=document.createElement("span");
                  span.className="move"; span.dataset.index=idx;
                  span.textContent=(idx%2===0?(Math.floor(idx/2)+1)+".":"")+mv;
                  $("#notation")[0].appendChild(span);
                  span.onclick=()=>goToMove(idx);
                });
                goToMove(modalMoves.length-1);
              }
            }
          });
        });
      }catch(e){ console.warn("update error",e); }
    }
  }

  // Запуск
  $(init);
})();
</script>
</body>
</html>
