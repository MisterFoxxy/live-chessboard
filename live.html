<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Live‑PGN — тур 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Стили chessboard.js -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .board-wrapper {
      display: inline-block;
      vertical-align: top;
      margin: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 300px;
    }
    .board-wrapper h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .board {
      width: 280px;
      margin: auto 0;
    }
    .players {
      margin-top: 8px;
      font-size: 14px;
      text-align: left;
      line-height: 1.4;
    }
    .players b { display: inline-block; width: 60px; }
  </style>
</head>
<body>

  <h2>Все доски тура 1</h2>
  <div id="boards-container"></div>

  <!-- зависимости -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.1/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    const PGN_URL = "https://live.idchess.com/download/shared/pgn/gs-eJ8OrndCwXa9d7thEJl1DyD2DNu7IxZBAlKBDIdkh315Ibjc6u_5jGnbAsw3Z?type=tournament";
    const container = document.getElementById('boards-container');
    const gamesMap = {};

    function parseGames(text) {
      return text
        .split(/\n(?=\[TimeControl)/g)
        .map(s => s.trim())
        .filter(Boolean);
    }
    function parseHeaders(pgn) {
      const H = {};
      pgn.split('\n').forEach(l => {
        const m = l.match(/^\[(\w+)\s+"(.+)"\]/);
        if (m) H[m[1]] = m[2];
      });
      return H;
    }

    async function updateAll() {
      try {
        const res = await fetch(PGN_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.statusText);
        const txt = await res.text();
        const chunks = parseGames(txt);

        // проходим по всем партиям тура 1
        chunks.forEach(chunk => {
          const hdr = parseHeaders(chunk);
          if (hdr.Round !== "1") return;

          const boardId = hdr.Board.trim();
          // если ещё нет — создаём блок
          if (!gamesMap[boardId]) {
            const wrap = document.createElement('div');
            wrap.className = 'board-wrapper';

            const title = document.createElement('h3');
            title.textContent = `Доска ${boardId}`;
            wrap.appendChild(title);

            const boardDiv = document.createElement('div');
            boardDiv.id = `board-${boardId}`;
            boardDiv.className = 'board';
            wrap.appendChild(boardDiv);

            const playersDiv = document.createElement('div');
            playersDiv.id = `players-${boardId}`;
            playersDiv.className = 'players';
            wrap.appendChild(playersDiv);

            container.appendChild(wrap);

            const chess = new Chess();
            const board = Chessboard(boardDiv.id, {
              draggable: false,
              position: 'start',
              pieceTheme: 'https://misterfoxxy.github.io/live-chessboard/img/chesspieces/wikipedia/{piece}.png'
            });

            gamesMap[boardId] = {
              chess, board, playersDiv, lastCount: 0
            };
          }

          // обновляем доску
          const g = gamesMap[boardId];
          g.chess.load_pgn(chunk);
          g.board.position(g.chess.fen());

          // обновляем игроков и результат, если ходы изменились
          const count = g.chess.history().length;
          if (count !== g.lastCount) {
            const w = hdr.White || "—";
            const b = hdr.Black || "—";
            const r = hdr.Result || "*";
            g.playersDiv.innerHTML = 
              `<div><b>White:</b> ${w}</div>` +
              `<div><b>Black:</b> ${b}</div>` +
              `<div><b>Result:</b> ${r}</div>`;
            g.lastCount = count;
          }
        });

      } catch (err) {
        console.error("Ошибка загрузки PGN:", err);
      }
    }

    // первый запуск и авто‑обновление
    updateAll();
    setInterval(updateAll, 5000);
  </script>
</body>
</html>
